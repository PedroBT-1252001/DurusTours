spring:
  application:
    name: durustours-backend
  datasource:
    url: jdbc:h2:mem:durustours;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    # Hibernate creates the schema before data.sql runs, instead of the default
    # order where data.sql would run first and fail against nonexistent tables.
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
